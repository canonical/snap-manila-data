name: manila-data
base: core26
version: "2026.2"
license: Apache-2.0
summary: OpenStack Manila data migration and copy service
description: |
  Snap package for the manila-data service from OpenStack Manila, the Shared
  Filesystems service. The manila-data daemon handles data copy and migration
  operations between shares, such as driver-assisted and host-assisted share
  migration and creating shares from snapshots that require data copying.

  This snap includes support for Ceph (via ceph-common) and NFS backends.
  Configuration is managed through snap configuration options (snap set/get)
  for database connectivity, RabbitMQ messaging, debug mode, and telemetry
  notifications.

confinement: strict
grade: stable

package-repositories:
  - type: apt
    # Hibiscus 2026.2 is only in the UCA -proposed pocket so far.
    # Switch pocket to updates once it is promoted.
    cloud: hibiscus
    pocket: proposed
    priority: always

environment:
  PYTHONPATH: $SNAP/lib/python3.14:$SNAP/lib/python3.14/site-packages:$SNAP/lib/python3/dist-packages:$PYTHONPATH

layout:
  # mount(8) only looks for mount.<type> helpers in /sbin (-> /usr/sbin).
  /usr/sbin/mount.nfs:
    bind-file: $SNAP/bin/mount.nfs
  /usr/sbin/mount.nfs4:
    bind-file: $SNAP/bin/mount.nfs
  # librados/libcephfs/librbd find libceph-common through a RUNPATH on this
  # path, and libceph-common loads its compressor/crypto plugins from it.
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ceph:
    symlink: $SNAP/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ceph

apps:
  manila-data:
    environment:
      # Standard library components must have priority in module name resolution: https://storyboard.openstack.org/#!/story/2007806
      PYTHONPATH: $PYTHONPATH:$SNAP/usr/lib/python3.14:$SNAP/usr/lib/python3.14/site-packages:$SNAP/usr/lib/python3/dist-packages:$SNAP/lib/python3.14:$SNAP/lib/python3.14/site-packages
    command: bin/manila-data
    daemon: simple
    plugs:
      - network
      - network-bind
      - mount-observe
      - nfs-mount
      # Fix cotyledon workers spawned via multiprocessing cannot creating POSIX
      # semaphores at `/dev/shm/sem.*` in strict confinement.
      - shared-memory

plugs:
  shared-memory:
    interface: shared-memory
    private: true

parts:
  openstack:
    plugin: nil
    stage-packages:
      - manila-data
      - ceph-common
      # mount(8) inside $SNAP
      - mount
      # Provides mount.nfs for host-assisted migration of NFS shares.
      - nfs-common
      # Runtime dep of the ceph snappy compressor plugin, not in core26.
      - libsnappy1v5
    override-build: |
      craftctl default
      # purge some dangling symlinks
      rm -rf $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/netaddr/eui/iab.txt
      rm -rf $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/netaddr/eui/oui.txt
      rm -rf $CRAFT_PART_INSTALL/usr/lib/python3.14/dist-packages/netaddr/eui/iab.txt
      rm -rf $CRAFT_PART_INSTALL/usr/lib/python3.14/dist-packages/netaddr/eui/oui.txt
    organize:
      usr/bin/: bin/
      usr/sbin/: bin/
      usr/lib/: lib/
      usr/share/: share/
    prime:
      - bin/manila-data
      # Root helper and filters for the commands manila-data runs as root
      # (mount, umount, ls, stat, cp, ...).
      - bin/manila-rootwrap
      - share/manila-common/rootwrap.d
      # mount(8) and the helpers it runs for host-assisted migration.
      - bin/mount
      - bin/mount.nfs*
      - lib/python3
      # Shared libraries needed by the C extensions in lib/python3.
      - lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      # Remove libraries for unused ceph-dencoder debug plugins and
      # OSD block device plugins.
      - -lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ceph/denc
      - -lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/ceph/extblkdev

  manila-data:
    after: [openstack]
    plugin: uv
    source: .
    build-packages:
      - git
    build-snaps:
      - astral-uv
    build-environment:
      # PyO3 doesn't yet support Python 3.14; use stable ABI for forward compatibility
      - PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    stage-packages:
      - python3-venv
    override-build: |
      craftctl default
      manila-data-snap-helpers write-hooks
      # Remove venv symlinks that conflict with the openstack part
      rm -f $CRAFT_PART_INSTALL/bin/python
      rm -f $CRAFT_PART_INSTALL/bin/python3
      rm -f $CRAFT_PART_INSTALL/bin/python3.14
    override-prime: |
      craftctl default
      # Remove dangling venv symlinks pointing into the build directory.
      rm -f $CRAFT_PRIME/bin/python
      rm -f $CRAFT_PRIME/bin/python3
      rm -f $CRAFT_PRIME/bin/python3.14
      # Remove build-time parts requiring uv launchers.
      rm -f $CRAFT_PRIME/bin/manila-data-snap-helpers
      rm -f $CRAFT_PRIME/bin/snap-helpers

  bin:
    source: bin/
    plugin: dump
    organize:
      "*": usr/bin/

hooks:
  install:
    plugs: [network]
  configure:
    plugs:
      - network
      - network-control
      - firewall-control
